services:
  - type: web
    name: ryvolt
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--experimental-strip-types"
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_ADMIN_ENABLED
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        value: "admin@gmail.com"
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
